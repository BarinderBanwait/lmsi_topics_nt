<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="curve-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="triangle-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#53a8b6;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#79d7be;stop-opacity:0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
  </g>

  <!-- LEFT: Pythagorean triple / right triangle (3-4-5) -->
  <g transform="translate(80, 100)">
    <!-- Triangle -->
    <polygon points="0,200 240,200 240,0" fill="url(#triangle-grad)" stroke="#79d7be" stroke-width="2"/>
    <!-- Right angle marker -->
    <rect x="215" y="175" width="25" height="25" fill="none" stroke="#79d7be" stroke-width="1.5" opacity="0.8"/>
    <!-- Side labels -->
    <text x="-25" y="110" fill="#79d7be" font-family="Georgia, serif" font-size="22" font-style="italic" opacity="0.9">5</text>
    <text x="115" y="230" fill="#79d7be" font-family="Georgia, serif" font-size="22" font-style="italic" opacity="0.9">4</text>
    <text x="255" y="110" fill="#79d7be" font-family="Georgia, serif" font-size="22" font-style="italic" opacity="0.9">3</text>
    <!-- Equation -->
    <text x="60" y="270" fill="#79d7be" font-family="Georgia, serif" font-size="18" opacity="0.7">a² + b² = c²</text>
  </g>

  <!-- CENTER: Elliptic curve y² = x³ - x -->
  <g transform="translate(480, 200)">
    <!-- Axes -->
    <line x1="-120" y1="0" x2="160" y2="0" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <line x1="0" y1="-160" x2="0" y2="160" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <!-- Elliptic curve y² = x³ - x (scaled) -->
    <!-- Upper branch -->
    <path d="M -40,0 C -40,-20 -35,-55 -20,-70 C -5,-85 10,-80 20,-65 C 30,-50 50,-90 70,-110 C 90,-130 110,-155 140,-170"
          fill="none" stroke="url(#curve-grad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Lower branch (mirror) -->
    <path d="M -40,0 C -40,20 -35,55 -20,70 C -5,85 10,80 20,65 C 30,50 50,90 70,110 C 90,130 110,155 140,170"
          fill="none" stroke="url(#curve-grad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Chord line between two points -->
    <circle cx="-20" cy="-70" r="4" fill="#ff6b6b" opacity="0.9"/>
    <circle cx="70" cy="-110" r="4" fill="#ff6b6b" opacity="0.9"/>
    <line x1="-40" y1="-60" x2="110" y2="-128" stroke="#ff6b6b" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4,4"/>
    <!-- Label -->
    <text x="-60" y="195" fill="#e94560" font-family="Georgia, serif" font-size="18" opacity="0.7">y² = x³ − x</text>
  </g>

  <!-- RIGHT: Modular arithmetic / finite field -->
  <g transform="translate(830, 80)">
    <!-- Clock-like circle for mod p -->
    <circle cx="120" cy="120" r="100" fill="none" stroke="#e2b04a" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Dots around the circle for elements of Z/pZ (p=7) -->
    <circle cx="120" cy="20" r="6" fill="#e2b04a" opacity="0.8"/>  <!-- 0 -->
    <text x="112" y="14" fill="#e2b04a" font-family="Georgia, serif" font-size="14" opacity="0.6">0</text>
    <circle cx="206" cy="57" r="6" fill="#e2b04a" opacity="0.8"/>  <!-- 1 -->
    <text x="218" y="57" fill="#e2b04a" font-family="Georgia, serif" font-size="14" opacity="0.6">1</text>
    <circle cx="226" cy="145" r="6" fill="#e2b04a" opacity="0.8"/> <!-- 2 -->
    <text x="238" y="150" fill="#e2b04a" font-family="Georgia, serif" font-size="14" opacity="0.6">2</text>
    <circle cx="178" cy="213" r="6" fill="#e2b04a" opacity="0.8"/> <!-- 3 -->
    <text x="188" y="222" fill="#e2b04a" font-family="Georgia, serif" font-size="14" opacity="0.6">3</text>
    <circle cx="62" cy="213" r="6" fill="#e2b04a" opacity="0.8"/>  <!-- 4 -->
    <text x="42" y="222" fill="#e2b04a" font-family="Georgia, serif" font-size="14" opacity="0.6">4</text>
    <circle cx="14" cy="145" r="6" fill="#e2b04a" opacity="0.8"/>  <!-- 5 -->
    <text x="-4" y="150" fill="#e2b04a" font-family="Georgia, serif" font-size="14" opacity="0.6">5</text>
    <circle cx="34" cy="57" r="6" fill="#e2b04a" opacity="0.8"/>   <!-- 6 -->
    <text x="16" y="54" fill="#e2b04a" font-family="Georgia, serif" font-size="14" opacity="0.6">6</text>
    <!-- Connecting some solutions (e.g. x² ≡ 2 mod 7: x=3,4) -->
    <line x1="178" y1="213" x2="62" y2="213" stroke="#e2b04a" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3,3"/>
    <!-- Label -->
    <text x="40" y="270" fill="#e2b04a" font-family="Georgia, serif" font-size="18" opacity="0.7">x² ≡ 2 (mod 7)</text>
  </g>

  <!-- Scattered small decorative dots -->
  <circle cx="420" cy="50" r="2" fill="#ffffff" opacity="0.1"/>
  <circle cx="450" cy="370" r="2" fill="#ffffff" opacity="0.1"/>
  <circle cx="780" cy="30" r="2" fill="#ffffff" opacity="0.1"/>
  <circle cx="380" cy="380" r="2" fill="#ffffff" opacity="0.1"/>
  <circle cx="750" cy="380" r="2" fill="#ffffff" opacity="0.1"/>
</svg>
